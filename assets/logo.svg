<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">rea-workflow</title>
  <desc id="d">Khiên bảo vệ chứa mã máy của mẫu, kính lúp với dấu kiểm và chuỗi bước phân tích: dịch ngược mã độc an toàn, có kiểm chứng.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1624"/>
      <stop offset="1" stop-color="#11293a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3b4f"/>
      <stop offset="1" stop-color="#14283a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M256 70 L408 124 V250 C408 342 342 408 256 444 C170 408 104 342 104 250 V124 Z"/>
    </clipPath>
  </defs>

  <!-- nền -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- khiên: phân tích tĩnh, không thực thi mẫu -->
  <path d="M256 70 L408 124 V250 C408 342 342 408 256 444 C170 408 104 342 104 250 V124 Z"
        fill="url(#shield)" stroke="url(#accent)" stroke-width="10" stroke-linejoin="round"/>

  <!-- mã máy của mẫu (header PE) mờ phía sau -->
  <g clip-path="url(#shieldClip)" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="22" fill="#5eead4" opacity="0.18">
    <text x="146" y="150">4D 5A 90 00 03 00</text>
    <text x="146" y="182">B8 00 00 00 40 00</text>
    <text x="146" y="214">0E 1F BA 0E 00 B4</text>
    <text x="146" y="246">09 CD 21 B8 01 4C</text>
    <text x="146" y="278">50 45 00 00 4C 01</text>
    <text x="146" y="310">E8 ?? ?? ?? ?? 31</text>
    <text x="146" y="342">C0 8B 45 FC 33 C1</text>
  </g>

  <!-- kính lúp: dịch ngược; dấu kiểm: kết luận có bằng chứng -->
  <circle cx="236" cy="232" r="74" fill="#0b1624" fill-opacity="0.85" stroke="#e6f6f4" stroke-width="16"/>
  <path d="M290 288 L346 344" stroke="#e6f6f4" stroke-width="26" stroke-linecap="round"/>
  <path d="M200 234 L226 260 L276 206" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- chuỗi bước: triage → decompile → giả lập → báo cáo -->
  <g stroke="#2dd4bf" stroke-width="6" fill="#0b1624">
    <path d="M190 384 H322"/>
    <circle cx="190" cy="384" r="11"/>
    <circle cx="234" cy="384" r="11"/>
    <circle cx="278" cy="384" r="11"/>
    <circle cx="322" cy="384" r="13" fill="#2dd4bf"/>
  </g>
</svg>
