[package]
name = "rea_hook"
version = "0.2.0"
edition = "2021"
description = "Hook basic-block nóng của winemu bằng Rust (ABI C, nạp bằng ctypes), không phụ thuộc crate ngoài"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
